[package]
name = "relay-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
slint = { version = "=1.16.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tiny-skia = "=0.12.0"
# Native styled spans use the same pinned Slint version as the renderer.
i-slint-common = "=1.16.1"
grammers-client = "0.10"
grammers-session = "0.10"
grammers-mtsender = "0.10"
grammers-tl-types = "0.10"
# grammers-crypto 0.10 uses the pre-release API; stable 2.0 is incompatible.
glass_pumpkin = "=2.0.0-rc0"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
chrono = "0.4"
rfd = "=0.17.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[build-dependencies]
slint-build = "=1.16.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[dev-dependencies]
# Render UI regression tests with the same engine as the application.
i-slint-renderer-skia = "=1.16.1"

# Optimize the generated Slint layout/binding code as well as dependencies.
# Keep dev builds inexpensive; release artifacts are the performance build.
[profile.release.package.relay-desktop]
opt-level = 3

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
